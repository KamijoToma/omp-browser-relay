name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test test
      - run: bun run build
      - name: Install isolated desktop tools
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox xdotool
      - name: Exercise dedicated-window isolation in Chrome
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          RELAY_SMOKE_NATIVE_INPUT: "1"
          RELAY_SMOKE_WINDOW_MANAGER: openbox
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24 -nolisten tcp" bun scripts/smoke.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omp-browser-relay
          path: |
            dist/cli.js
            dist/extension/
            dist/omp-browser-relay-extension.zip
